namespace: metrics
info:
  type: metric
  type_info:
    label: Metric
    summary: Pseudobulk condition-centroid perturbation prediction metrics
    description: >-
      A metric suite that compares predicted and observed perturbation-response
      centroids once and returns all applicable paper-derived scores.
arguments:
  - name: --prepared
    __merge__: file_condition_centroid_bundle.yaml
    required: true
    direction: input
  - name: --output
    __merge__: file_score.yaml
    required: true
    direction: output
