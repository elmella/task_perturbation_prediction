namespace: "metrics"
info:
  type: metric
  type_info:
    label: Metric
    summary: Differential-expression perturbation prediction metrics
    description: |
      A metric suite comparing predicted and observed condition-by-gene
      differential-expression results.
arguments:
  - name: --de_test
    __merge__: file_de_test.yaml
    required: true
    direction: input
  - name: --de_test_layer
    type: string
    direction: input
    default: clipped_sign_log10_pval
    description: In which layer to find the DE data.
  - name: --prediction
    __merge__: file_prediction.yaml
    required: true
    direction: input
  - name: --prediction_layer
    type: string
    direction: input
    default: prediction
    description: In which layer to find the predicted DE data.
  - name: --output
    __merge__: file_score.yaml
    direction: output
    required: true
  - name: --resolve_genes
    type: string
    direction: input
    default: de_test
    choices: [de_test, intersection]
    description: |
      How to resolve difference in genes between the two datasets.
