namespace: metrics
info:
  type: metric
  type_info:
    label: Metric
    summary: A single-cell perturbation-population metric.
    description: >-
      A metric component that compares predicted and observed cells without
      reducing either population to a condition centroid.
arguments:
  - name: --observed
    __merge__: file_single_cell_observed.yaml
    required: true
    direction: input
  - name: --prediction
    __merge__: file_single_cell_prediction.yaml
    required: true
    direction: input
  - name: --output
    __merge__: file_score.yaml
    required: true
    direction: output
  - name: --perturbation_key
    type: string
    default: perturbation
    description: Column in obs containing perturbation labels in both inputs.
  - name: --group_keys
    type: string
    multiple: true
    description: >-
      Optional obs columns defining independent evaluation groups, such as
      cell_type or donor_id. scPertEval is prepared separately within each
      group and condition-level scores are macro-aggregated across groups.
  - name: --control_label
    type: string
    default: control
    description: Label identifying control cells in the observed input.
  - name: --min_cells
    type: integer
    default: 30
    min: 2
    description: Minimum observed cells required for a perturbation to be scored.
  - name: --subsample
    type: integer
    default: 8192
    min: 2
    description: Size of scPertEval's shared all-perturbed reference sample.
  - name: --seed
    type: integer
    default: 42
    description: Random seed used by scPertEval.
  - name: --workers
    type: integer
    default: 0
    min: 0
    description: Worker threads; zero lets scPertEval choose automatically.
  - name: --de_method
    type: string
    default: t-test
    choices: [t-test, MWU, t-test_overestim_var]
    description: Ground-truth DE method used to construct top-effect-size spaces.
