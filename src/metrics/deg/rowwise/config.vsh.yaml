__merge__: ../../../api/comp_metric.yaml
name: rowwise
info:
  metrics:
    - &benchmark_metric
      name: mean_rowwise_rmse
      label: Mean Rowwise RMSE
      summary: Mean condition-level root mean squared error.
      description: >-
        Computes RMSE over genes for each condition and averages the resulting
        condition scores.
      min: 0
      max: +.inf
      maximize: false
      references: &benchmark_reference
        bibtex: |
          @article{slazata2024benchmark,
            title = {A benchmark for prediction of transcriptomic responses to chemical perturbations across cell types},
            author = {Artur Szałata and Andrew Benz and Robrecht Cannoodt and Mauricio Cortes and Jason Fong and Sunil Kuppasani and Richard Lieberman and Tianyu Liu and Javier A. Mas-Rosario and Rico Meinl and Jalil Nourisa and Jared Tumiel and Tin M. Tunjic and Mengbo Wang and Noah Weber and Hongyu Zhao and Benedict Anchang and Fabian J Theis and Malte D Luecken and Daniel B Burkhardt},
            booktitle = {The Thirty-eight Conference on Neural Information Processing Systems Datasets and Benchmarks Track},
            year = {2024},
            url = {https://openreview.net/forum?id=WTI4RJYSVm}
          }
    - <<: *benchmark_metric
      name: mean_rowwise_mae
      label: Mean Rowwise MAE
      summary: Mean condition-level mean absolute error.
      description: >-
        Computes MAE over genes for each condition and averages the resulting
        condition scores.
    - <<: *benchmark_metric
      name: mean_rowwise_pearson
      label: Mean Rowwise Pearson
      summary: Mean condition-level Pearson correlation.
      description: >-
        Computes Pearson correlation over genes for each condition and averages
        the resulting scores; undefined condition correlations contribute zero.
      min: -1
      max: 1
      maximize: true
    - <<: *benchmark_metric
      name: mean_rowwise_spearman
      label: Mean Rowwise Spearman
      summary: Mean condition-level Spearman correlation.
      description: >-
        Computes Spearman correlation over genes for each condition and averages
        the resulting scores; undefined condition correlations contribute zero.
      min: -1
      max: 1
      maximize: true
    - <<: *benchmark_metric
      name: mean_rowwise_cosine
      label: Mean Rowwise Cosine
      summary: Mean condition-level cosine similarity.
      description: >-
        Computes cosine similarity over genes for each condition and averages
        the resulting scores; undefined condition similarities contribute zero.
      min: -1
      max: 1
      maximize: true
resources:
  - type: python_script
    path: script.py
  - path: ../_shared/rowwise_suite.py
  - path: ../../_shared/metric_result.py
test_resources:
  - type: python_script
    path: /common/component_tests/check_config.py
  - type: python_script
    path: /common/component_tests/run_and_check_output.py
  - type: python_script
    path: ../_shared/test_rowwise_component.py
  - type: python_script
    path: ../../_shared/test_metric_result.py
  - path: /resources/datasets/neurips-2023-data
    dest: resources/datasets/neurips-2023-data
engines:
  - type: docker
    image: openproblems/base_python:1.0.0
runners:
  - type: executable
  - type: nextflow
    directives:
      label: [midtime, highmem, highcpu]
